[project]
name = "oblique"
version = "0.0.1"
description = "An inference-time perturbation deck for diverse scientific ideation with Meta models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblique"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
