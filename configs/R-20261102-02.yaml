# Real trial of bring your papers: one refused upload and two sets, through the app's own API.
# uv run --env-file <path to .env> python -m oblique.product.trial configs/R-20261102-02.yaml
run_id: R-20261102-02
cache: .cache/product-trial.db
ledger: runs/R-20261102-02/ledger.jsonl
page: web/product/index.html
pdf_dir: data/trial          # not committed: each PDF stays available from arXiv under its license

# Licenses read from arXiv's OAI metadata on 2026-11-02. The flow needs two accepted PDFs, so the
# trial uses two within the limit and one past it.
papers:
  - {arxiv_id: "2307.03109", version: v9, license: CC BY 4.0, pages: 45, role: accepted, title: "A Survey on Evaluation of Large Language Models"}
  - {arxiv_id: "2305.03726", version: v2, license: CC BY 4.0, pages: 17, role: accepted, title: "Otter: A Multi-Modal Model with In-Context Instruction Tuning"}
  - {arxiv_id: "2409.04109", version: v1, license: CC BY 4.0, pages: 94, role: long, title: "Can LLMs Generate Novel Research Ideas? A Large-Scale Human Study with 100+ NLP Researchers"}

generator:
  provider: meta
  model: muse-spark-1.3
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  sheet_params: {temperature: 0, max_tokens: 6000, reasoning_effort: low, response_format: {type: json_object}}
  timeout_seconds: 300
  max_attempts: 3

prices_per_m:
  muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}   # dev.meta.ai pricing page, 2026-11-01

limits:
  min_documents: 2
  max_documents: 5
  max_file_mb: 20
  max_pages_per_document: 50
  sets_per_session: 3
  session_usd: 0.40          # approved up to US$0.50; no new call past this, calls in flight fit under it
  budget_usd: 0.40
  max_running_sets: 2

deck:
  note: "Provisional deck: the final one is chosen after the confirmation run."
  cards: [OB-001, OB-004, OB-005, OB-007, OB-008, OB-009, OB-011, OB-012, OB-013,
          OB-016, OB-018, OB-020, OB-022, OB-023, OB-025, OB-026, OB-027, OB-029]
