# Validate the anchor as the quality reference (ADR-008): 20 anchors, then the 120 C0 / C1 ideas
# of R-20261030-03 re-judged against them, both orders.
# python -m oblique.anchor_check configs/R-20261030-04.yaml
run_id: R-20261030-04
split: A
cache: .cache/responses.db

prompts: [ideation-v2, quality-v1]
q_reference: anchor
source_generations: runs/R-20261030-03/generations.jsonl

# Same 20 instances as the baseline. The run refuses to start if this differs from the pick.
instances: [i-0246, i-0311, i-0356, i-0520, i-1312, i-1989, i-2659, i-2820, i-3651, i-4070,
            i-4104, i-4354, i-4593, i-5031, i-5677, i-5841, i-6000, i-6574, i-7426, i-7496]

# Identical to the baseline generator: an anchor is one more K = 1 draw, at sample_idx 500.
generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16

judges:
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8           # adaptive: halves on a 429, floor 1
    adaptive: true

budget:
  approved_usd: 0.20
  stop_usd: 0.15             # no new call past this; calls in flight stay under the approval
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30
