# The confirmation on split B, once (ADR-003, ADR-009, ADR-010 and its amendment 2).
# uv run python -m oblique.confirm configs/R-20261103-01.yaml --plan     (the gate: no API, B stays sealed)
# OBLIQUE_UNSEAL_B=1 uv run --group embed python -m oblique.confirm configs/R-20261103-01.yaml
# Only with the author's ok. A run that was cut resumes with the same command; a finished run refuses.
run_id: R-20261103-01
split: B
cache: .cache/responses.db

prompts: [ideation-v3, inject-v1, quality-v2, distance-v1, grounding-v1]
q_reference: anchor
q_gold: true                 # ADR-008: q against the gold is a secondary metric, and its ceiling is reported

conditions: [C1, C1s, Ts, R, E6, ML, MG]

no_card:
  C1s: {}
  Ts: {temperature: 1.5}

decks:
  R: [CTRL-R-001, CTRL-R-002, CTRL-R-003, CTRL-R-004, CTRL-R-005, CTRL-R-006, CTRL-R-007, CTRL-R-008,
      CTRL-R-009, CTRL-R-010, CTRL-R-011, CTRL-R-012, CTRL-R-013, CTRL-R-014, CTRL-R-015, CTRL-R-016,
      CTRL-R-017, CTRL-R-018, CTRL-R-019, CTRL-R-020, CTRL-R-021, CTRL-R-022, CTRL-R-023, CTRL-R-024,
      CTRL-R-025, CTRL-R-026, CTRL-R-027, CTRL-R-028, CTRL-R-029, CTRL-R-030]
  E6: [E6-1, E6-2, E6-3, E6-4, E6-5, E6-6]
  ML: [OB-001, OB-004, OB-005, OB-007, OB-008, OB-009, OB-011, OB-012, OB-013,
       OB-016, OB-018, OB-020, OB-022, OB-023, OB-025, OB-026, OB-027, OB-029]
  MG: [OB-G1-001, OB-G1-002, OB-G1-004, OB-G1-005, OB-G1-006, OB-G1-008, OB-G1-009, OB-G1-012, OB-G1-013]

# The selections on split A that the decks above must match, and the card of every idea.
map_metrics: runs/R-20261031-01/metrics.json
g1_metrics: runs/R-20261102-01/metrics.json
draws: configs/R-20261103-01.draws.json

# ADR-006, amendment 7 (the author, 2026-11-02, before the judges and with no result in view): the
# provider returned 500 in every transport retry and in 3 launches. Not asked again.
provider_errors:
  - {instance: i-4183, condition: Ts, slot: 2}

# ADR-010, amendment 3: agreement only, it does not decide H1. The same positions in every condition.
wonder:
  ideas_per_condition: 30
  positions: configs/R-20261103-01.wonder.json

delta: 0.05                  # ADR-003
grounding_guard: -0.10       # ADR-003: reported, does not decide H1
n_boot_h1: 10000             # ADR-010, amendment 2, with BCa as a check
n_boot_other: 2000           # ADR-010, amendment 2: H3, H4, H6, H7

generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16
  # Added 2026-11-02 after two cuts: some Ts calls (temperature 1.5) did not finish in the default
  # 180 s per attempt. It does not change any cache key or response.
  timeout_seconds: 900

judges:
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8           # adaptive: +1 every 50 straight successes up to the ceiling, halves on a 429
    adaptive: true
    max_concurrency: 12
  wonder:
    provider: meta
    model: muse-wonder-1.0   # Wonder has no Contributor mode
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 4
    adaptive: true
    max_concurrency: 8

budget:
  approved_usd: 4.00         # the author, 2026-11-02
  stop_usd: 3.70             # no new call past this; calls in flight stay under the approval
  ledger: true               # spend survives a resume
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30
    muse-wonder-1.0: {in: 4.0, cached: 0.20, out: 20.0}                # dev.meta.ai pricing page, 2026-11-01

# Per call, for --plan only. Measured on R-20261031-01 and R-20261102-01, except c1, which is the
# price of its measured tokens. Sequential uses C1s (0.00057) rounded up, for the cards.
estimate:
  anchor: {usd: 0.00036, seconds: 16}
  c1: {usd: 0.00100, seconds: 16}
  sequential: {usd: 0.00060, seconds: 16}
  quality: {usd: 0.00011, seconds: 3.8}
  quality_gold: {usd: 0.00011, seconds: 3.8}
  quality_wonder: {usd: 0.0040, seconds: 4}   # R-20261030-03: mean 0.0033, max 0.0058, at list prices
  grounding: {usd: 0.00019, seconds: 3.8}
  distance: {usd: 0.00014, seconds: 6.8}
estimate_judge_calls_per_minute: 86   # R-20261102-01: 3,887 judge calls in about 45 minutes
