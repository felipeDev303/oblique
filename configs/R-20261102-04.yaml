# Real trial of the side-by-side view: one call (K=3) against Oblique sequential (E6), through the
# app's own API. Approved up to US$0.40.
# uv run --env-file <path to .env> --group product python -m oblique.product.trial configs/R-20261102-04.yaml
# Afterwards the same config serves the page, sharing this ledger and its cap:
# uv run --env-file <path to .env> --group product python -m oblique.product.app configs/R-20261102-04.yaml
run_id: R-20261102-04
cache: .cache/product-trial-04.db    # new: the sheets are paid again, as for a first-time user
ledger: runs/R-20261102-04/ledger.jsonl
page: web/product/index.html
pdf_dir: data/trial          # not committed: each PDF stays available from arXiv under its license
host: 127.0.0.1
port: 8000
example: examples/papers/example.json   # so the page served from this config offers the example papers

# The two accepted papers of R-20261102-02; licenses read from arXiv's OAI metadata on 2026-11-02,
# first authors from the arXiv abstract pages on 2026-11-03. The example papers of the app come
# from this trial (python -m oblique.product.examples).
papers:
  - {arxiv_id: "2307.03109", version: v9, license: CC BY 4.0, pages: 45, role: accepted, title: "A Survey on Evaluation of Large Language Models", authors: "Yupeng Chang et al."}
  - {arxiv_id: "2305.03726", version: v2, license: CC BY 4.0, pages: 17, role: accepted, title: "Otter: A Multi-Modal Model with In-Context Instruction Tuning", authors: "Bo Li et al."}

sets:
  - {name: side-by-side, view: side_by_side, cards: "on"}

generator:
  provider: meta
  model: muse-spark-1.3
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  sheet_params: {temperature: 0, max_tokens: 6000, reasoning_effort: low, response_format: {type: json_object}}
  timeout_seconds: 300
  max_attempts: 3

prices_per_m:
  muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}   # dev.meta.ai pricing page, 2026-11-01

limits:
  min_documents: 2
  max_documents: 5
  max_file_mb: 20
  max_pages_per_document: 50
  sets_per_session: 3
  session_usd: 0.40
  budget_usd: 0.36           # cap US$0.40: no new call past 0.36, so the call in flight fits under it
  max_running_sets: 2

deck:
  name: E6
  experimental: true
  note: "Experimental deck: on split B no deck was shown to keep the quality of the sequential set without cards."
  cards: [E6-1, E6-2, E6-3, E6-4, E6-5, E6-6]
