# The limits of the proxy's real trial, in the shape of the app's config, with its own ledger.
ledger: runs/R-20261102-03/ledger.jsonl

generator:
  provider: meta
  model: muse-spark-1.3
  params: {temperature: 1.0, max_tokens: 4000}
  sheet_params: {temperature: 0, max_tokens: 4000}
  timeout_seconds: 300
  max_attempts: 2

prices_per_m:
  muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}   # dev.meta.ai pricing page, 2026-11-01

