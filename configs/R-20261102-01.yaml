# The G1 cards on split A (ADR-010 and its amendment), with the anchors, S0 and C2 of the map.
# uv run python -m oblique.evolve.measure configs/R-20261102-01.yaml --write-cards   (the deck files)
# uv run python -m oblique.evolve.measure configs/R-20261102-01.yaml --plan          (counts, no API calls)
# uv run --group embed python -m oblique.evolve.measure configs/R-20261102-01.yaml
# Resumable: rerunning pays only for what is not in the response cache.
run_id: R-20261102-01
split: A
cache: .cache/responses.db

prompts: [ideation-v3, inject-v1, quality-v2, distance-v1, grounding-v1]
q_reference: anchor

map_run: runs/R-20261031-01  # its stored judgments enter the joint regression; it is not changed
record_dir: deck/evolution/G1
created: 2026-11-01
discarded: [OB-G1-011, OB-G1-014]   # the author's ADR-002 review (ADR-010, amendment); no replacements

cards:
  evolved: [OB-G1-001, OB-G1-002, OB-G1-003, OB-G1-004, OB-G1-005, OB-G1-006, OB-G1-007,
            OB-G1-008, OB-G1-009, OB-G1-010, OB-G1-012, OB-G1-013, OB-G1-015]

no_card:
  C2: {}                     # the map's C2: same draws, same judgments, from the cache

delta: 0.05                  # ADR-003, ADR-008
n_boot: 2000                 # ADR-003: refits the regression on 2,000 resamples

generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16

judges:
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8           # adaptive: +1 every 50 straight successes up to the ceiling, halves on a 429
    adaptive: true
    max_concurrency: 12

budget:
  approved_usd: 1.50
  stop_usd: 1.40             # no new call past this; calls in flight stay under the approval
  ledger: true               # spend survives a resume
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30

# Measured on the cards of the map (R-20261031-01), per call, for --plan only.
estimate:
  anchor: {usd: 0.00037, seconds: 16}
  s0: {usd: 0.00062, seconds: 16}
  condition: {usd: 0.00049, seconds: 16}
  quality: {usd: 0.00011, seconds: 3.8}
  grounding: {usd: 0.00019, seconds: 3.8}
  distance: {usd: 0.00014, seconds: 6.8}
