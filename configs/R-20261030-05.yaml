# Validate length control and sequential generation (ADR-009): new anchors and new C0, C1 and C1s
# with ideation-v3, judged against the anchor with quality-v2 in both orders, plus grounding.
# uv run --group embed python -m oblique.length_check configs/R-20261030-05.yaml
run_id: R-20261030-05
split: A
cache: .cache/responses.db

prompts: [ideation-v3, quality-v2, grounding-v1]
q_reference: anchor
conditions: [C0, C1, C1s]

# The 20 baseline instances. The run refuses to start if this differs from the pick.
instances: [i-0246, i-0311, i-0356, i-0520, i-1312, i-1989, i-2659, i-2820, i-3651, i-4070,
            i-4104, i-4354, i-4593, i-5031, i-5677, i-5841, i-6000, i-6574, i-7426, i-7496]

generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16

judges:
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8           # adaptive: halves on a 429, floor 1
    adaptive: true

budget:
  approved_usd: 0.30
  stop_usd: 0.26             # no new call past this; calls in flight stay under the approval
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30
