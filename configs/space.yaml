# Bring your papers on Hugging Face Spaces (deploy/space/). Same app and limits as product.yaml,
# exposed to the public, with the ledger on the Space's persistent storage.
cache: /data/oblique/product.db
ledger: /data/oblique/ledger.jsonl
persistent_dir: /data        # the app refuses to start without it: the budget must survive restarts
page: web/product/index.html
results_dir: web/results
host: 0.0.0.0                # inside the container; the Space puts it behind HTTPS
port: 7860
cookie_cross_site: true      # the Space page shows the app inside an iframe

generator:
  provider: meta
  model: muse-spark-1.3      # Standard: Contributor lets Meta train on the content, and the app refuses it
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  sheet_params: {temperature: 0, max_tokens: 6000, reasoning_effort: low, response_format: {type: json_object}}
  timeout_seconds: 300
  max_attempts: 3

prices_per_m:
  muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}   # dev.meta.ai pricing page, 2026-11-01

limits:
  min_documents: 2
  max_documents: 5
  max_file_mb: 20
  max_pages_per_document: 50
  sets_per_session: 3
  session_usd: 1.00          # a session is a cookie: clearing it starts a new one
  budget_usd: 9.70           # global cap US$10: no new call past 9.70, so calls in flight fit under it
  max_running_sets: 2

# The same deck as configs/product.yaml (ADR-011).
deck:
  name: E6
  experimental: true
  note: "Experimental deck: on split B no deck was shown to keep the quality of the sequential set without cards."
  cards: [E6-1, E6-2, E6-3, E6-4, E6-5, E6-6]
