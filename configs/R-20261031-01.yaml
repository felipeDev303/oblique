# Map of the deck on split A: 50 anchors, S0 = C1s, and one idea per card and instance.
# uv run python -m oblique.map_sweep configs/R-20261031-01.yaml --plan     (counts, no API calls)
# uv run --group embed python -m oblique.map_sweep configs/R-20261031-01.yaml
# Resumable: rerunning pays only for what is not in the response cache.
run_id: R-20261031-01
split: A
cache: .cache/responses.db

prompts: [ideation-v3, inject-v1, quality-v2, distance-v1, grounding-v1]
q_reference: anchor

cards:
  seed: [OB-001, OB-002, OB-003, OB-004, OB-005, OB-006, OB-007, OB-008, OB-009, OB-010,
          OB-011, OB-012, OB-013, OB-014, OB-015, OB-016, OB-017, OB-018, OB-019, OB-020,
          OB-021, OB-022, OB-023, OB-024, OB-025, OB-026, OB-027, OB-028, OB-029, OB-030]
  paper: [E6-1, E6-2, E6-3, E6-4, E6-5, E6-6]
  # oblique.deck.controls.pick_controls(all 30, 10), `cards` seed. The run refuses any other list.
  control: [CTRL-R-001, CTRL-R-004, CTRL-R-014, CTRL-R-015, CTRL-R-020, CTRL-R-021, CTRL-R-023, CTRL-R-025, CTRL-R-027, CTRL-R-030]

no_card:
  C2: {}                     # re-sample without a card: the reference of the bands (ADR-003, ADR-008)
  C2-T: {temperature: 1.5}   # same, at the highest temperature the API accepts (R-20261030-02)

delta: 0.05                  # ADR-003, ADR-008

generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16

judges:
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8           # adaptive: +1 every 50 straight successes up to the ceiling, halves on a 429
    adaptive: true
    max_concurrency: 12

budget:
  approved_usd: 5.00
  stop_usd: 4.60             # no new call past this; calls in flight stay under the approval
  ledger: true               # spend survives a resume
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30

# Measured on R-20261030-05 (distance on R-20261030-03), per call, for --plan only.
# Seconds are slot time: generation 16 s (60 calls/min at 16), judges 3.8 s (127 calls/min at 8),
# distance 6.8 s (R-20261030-01, one call: the roughest number here).
estimate:
  anchor: {usd: 0.00037, seconds: 16}
  s0: {usd: 0.00062, seconds: 16}
  condition: {usd: 0.00041, seconds: 16}
  quality: {usd: 0.00011, seconds: 3.8}
  grounding: {usd: 0.00029, seconds: 3.8}
  distance: {usd: 0.00015, seconds: 6.8}
