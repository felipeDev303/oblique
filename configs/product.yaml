# Bring your papers: uv run --group product python -m oblique.product.app configs/product.yaml
cache: .cache/product.db     # separate from the experiment; never holds the PDFs (DocumentCache)
ledger: runs/product/ledger.jsonl
page: web/product/index.html

# "Try with 2 example papers": two CC BY papers whose sheets and one-call set were computed in
# advance (R-20261102-04); only the sequential set is generated live.
example: examples/papers/example.json
host: 127.0.0.1
port: 8000

generator:
  provider: meta
  model: muse-spark-1.3      # Standard: Contributor lets Meta train on the content, and the app refuses it
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}   # the ideas
  sheet_params: {temperature: 0, max_tokens: 6000, reasoning_effort: low, response_format: {type: json_object}}
  timeout_seconds: 300
  max_attempts: 3

prices_per_m:
  muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}   # dev.meta.ai pricing page, 2026-11-01

limits:
  min_documents: 2
  max_documents: 5
  max_file_mb: 20
  max_pages_per_document: 50
  sets_per_session: 3
  session_usd: 1.00          # no new call past this in a session
  budget_usd: 10.00          # no new call past this across all sessions and restarts
  max_running_sets: 2

# The rule of ADR-010, amendment 3, applied after split B (ADR-011, runs/R-20261103-01/summary.md):
# ML, MG and E6 all missed the non-inferiority of controlled q against C1s, so the deck is the one
# with the highest controlled Δq, E6, marked experimental on the page.
deck:
  name: E6
  experimental: true
  note: "Experimental deck: on split B no deck was shown to keep the quality of the sequential set without cards."
  cards: [E6-1, E6-2, E6-3, E6-4, E6-5, E6-6]
