# Baseline C0 / C1 on 20 split A instances, with judge calibration.
# uv run --group embed python -m oblique.baseline configs/R-20261030-03.yaml
run_id: R-20261030-03
split: A
cache: .cache/responses.db

prompts: [ideation-v2, quality-v1, distance-v1, grounding-v1]

# 1 per domain + 4 more, drawn with the `baseline` seed: oblique.bench.pick_baseline(A).
# The run refuses to start if this list differs from the pick.
instances: [i-0246, i-0311, i-0356, i-0520, i-1312, i-1989, i-2659, i-2820, i-3651, i-4070,
            i-4104, i-4354, i-4593, i-5031, i-5677, i-5841, i-6000, i-6574, i-7426, i-7496]

# Author, 2026-10-30: temperature 1.0, default reasoning, no seed.
# Mode set by the gate R-20261030-02 (Contributor if it holds 16 without sustained 429s).
generator:
  provider: meta
  model: muse-spark-1.3-contributor
  params: {temperature: 1.0, max_tokens: 12000, response_format: {type: json_object}}
  concurrency: 16

judges:
  spark:                     # quality (both orders), distance (all pairs in a set), grounding
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    # 16 hit sustained 429s on the first launch (short calls, ~300 requests/min); resumed at 4.
    # Concurrency does not enter the cache key, so the resumed run reuses every finished call.
    concurrency: 4
  wonder:                    # quality (both orders) on all 120 ideas, for agreement only
    provider: meta
    model: muse-wonder-1.0
    params: {temperature: 0, max_tokens: 3000, reasoning_effort: minimal}
    concurrency: 8

budget:
  approved_usd: 3.00
  stop_usd: 2.50             # no new call past this; calls in flight can add at most ~US$0.30
  prices_per_m:
    muse-spark-1.3-contributor: {in: 0.10, cached: 0.002, out: 0.20}   # Billing, 2026-10-30
    muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}                # reference (unofficial)
    muse-wonder-1.0: {in: 4.0, cached: 0.20, out: 20.0}                # reference (unofficial)
