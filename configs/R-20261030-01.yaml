# Smoke test and cost gate: one split A instance, every call kind once.
# python -m oblique.smoke configs/R-20261030-01.yaml
run_id: R-20261030-01
split: A
instance: i-0032          # first ID in splits/A.txt
k: 3
cache: .cache/responses.db

prompts: [ideation-v2, quality-v1, distance-v1, grounding-v1]

generator:
  # Same prompt in Contributor and Standard to compare the real price (read from Billing).
  # Contributor mode is selected by model ID. Every model below is checked against
  # GET /v1/models before any paid call.
  contributor:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 1.0, max_tokens: 12000}
  standard:
    provider: meta
    model: muse-spark-1.3
    params: {temperature: 1.0, max_tokens: 12000}
  standard_low:              # Standard again with low reasoning effort, to compare reasoning tokens
    provider: meta
    model: muse-spark-1.3
    params: {temperature: 1.0, max_tokens: 12000, reasoning_effort: low}

judges:
  # Plan B (ADR-005): Spark judges at temperature 0 with the lowest reasoning effort the
  # API accepts (tried in order); Wonder is the second quality judge for agreement.
  spark:
    provider: meta
    model: muse-spark-1.3-contributor
    params: {temperature: 0, max_tokens: 3000}
    reasoning_effort: [none, minimal, low]
  wonder:
    provider: meta
    model: muse-wonder-1.0
    params: {temperature: 0, max_tokens: 3000}
    reasoning_effort: [none, minimal, low]

budget:
  approved_usd: 0.60
  stop_usd: 0.50             # no new call once the spend at these prices passes this
  # Reference prices (unofficial, vault note "Meta Model API"), USD per million tokens.
  # Contributor is priced as Standard: an upper bound until Billing shows the real price.
  prices_per_m:
    muse-spark-1.3: {in: 1.25, cached: 0.15, out: 4.25}
    muse-spark-1.3-contributor: {in: 1.25, cached: 0.15, out: 4.25}
    muse-wonder-1.0: {in: 4.0, cached: 0.20, out: 20.0}
